services:
  - type: web
    name: gulf-job-pipeline
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.dashboard_app:app --host 0.0.0.0 --port ${PORT:-8000}
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DASHBOARD_SESSION_SECRET
        generateValue: true
      - key: DASHBOARD_PASSWORD
        sync: false
